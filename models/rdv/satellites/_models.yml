                severity: error

      - name: manufacturer
        description: "Manufacturer identifier (from P_MFGR)"
        data_type: varchar
        tests:
          - not_null:
              config:
                severity: error

      - name: brand
        description: "Brand identifier (from P_BRAND)"
        data_type: varchar
        tests:
          - not_null:
              config:
                severity: error

      - name: part_type
        description: "Product type/category (from P_TYPE)"
        data_type: varchar
        tests:
          - not_null:
              config:
                severity: error

      - name: part_size
        description: "Product size (from P_SIZE)"
        data_type: number
        tests:
          - not_null:
              config:
                severity: error
          - dbt_utils.expression_is_true:
              expression: "> 0"
              config:
                severity: warn

      - name: container
        description: "Container type (from P_CONTAINER)"
        data_type: varchar
        tests:
          - not_null:
              config:
                severity: error

      - name: retail_price
        description: "Retail price (from P_RETAILPRICE)"
        data_type: number
        tests:
          - not_null:
              config:
                severity: error
          - dbt_utils.expression_is_true:
              expression: "> 0"
              config:
                severity: error

      - name: part_comment
        description: "Product comment/description (from P_COMMENT)"
        data_type: varchar

      - name: load_date
        description: "Effective from timestamp (Part of Composite PK)"
        data_type: timestamp_ntz
        tests:
          - not_null:
              config:
                severity: error

      - name: record_source
        description: "Source system: TPC_H"
        data_type: varchar
        tests:
          - not_null:
              config:
                severity: error
