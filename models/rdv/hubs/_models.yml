version: 2

models:
  - name: hub_customer
    description: |
      **Raw Data Vault Hub: Customer Business Keys**

      Contains the unique list of all customer business keys in the data warehouse.
      This hub is the single source of truth for customer identities across the enterprise.

      **Pattern**: Hub (Data Vault 2.0)
      **Grain**: One row per unique customer
      **Source**: stg_dv_customers (TPC-H CUSTOMER table)
      **Business Key**: CUSTOMER_KEY (Customer ID)
      **Load Strategy**: Incremental (insert-only, idempotent)

      **Key Characteristics**:
      - Immutable business keys (never updates, only inserts)
      - Hash key generated via MD5 for performance
      - Natural key stored for query convenience
      - Parent entity for SAT_CUSTOMER satellite
    meta:
      owner: "Data Engineering Team"
      layer: "rdv"
      entity_type: "hub"

    columns:
      - name: customer_hk
        description: |
          **Hash Key (Primary Key)**

          MD5 hash of the customer business key (CUSTOMER_KEY).
          Generated by AutomateDV to provide consistent, fast joins across the data vault.

          Format: BINARY(16) - 128-bit MD5 hash
          Hashed from: CUSTOMER_KEY (derived from C_CUSTKEY)
        data_type: binary
        tests:
          - unique:
              config:
                severity: error
                error_if: ">0"
          - not_null:
              config:
                severity: error

      - name: customer_key
        description: |
          **Natural Business Key**

          Business-friendly customer identifier derived from source C_CUSTKEY.
          Human-readable business key that business users recognize.

          Derived in staging from: C_CUSTKEY (TPC-H source column)
          Business Rule: Must match source system customer ID
        data_type: number
        tests:
          - unique:
              config:
                severity: error
          - not_null:
              config:
                severity: error
          - relationships:
              to: source('TPC_H', 'CUSTOMER')
              field: c_custkey
              config:
                severity: warn

      - name: load_date
        description: |
          **Load Timestamp (Effective From)**

          Timestamp when this customer business key was first seen in the data warehouse.
          Represents the "birth" of this customer entity in our system.

          **NOT** the customer's creation date in source system - this is DW load metadata.

          Usage: Temporal queries, audit trail, incremental load tracking
        data_type: timestamp_ntz
        tests:
          - not_null:
              config:
                severity: error
          - dbt_utils.expression_is_true:
              expression: "<= CURRENT_TIMESTAMP()"
              config:
                severity: error

      - name: record_source
        description: |
          **Source System Identifier**

          Identifies which source system contributed this business key.
          Format: '!TPC_H' (exclamation prefix indicates source system)

          Purpose: Multi-source data vault tracking, data lineage, compliance
        data_type: varchar
        tests:
          - not_null:
              config:
                severity: error
          - accepted_values:
              values: ["TPC_H"]
              config:
                severity: error

  - name: hub_order
    description: |
      **Raw Data Vault Hub: Order Business Keys**

      Contains the unique list of all order business keys in the data warehouse.
      Represents the core identity of customer orders across the enterprise.

      **Pattern**: Hub (Data Vault 2.0)
      **Grain**: One row per unique order
      **Source**: stg_dv_orders (TPC-H ORDERS table)
      **Business Key**: ORDER_KEY (Order ID)
      **Load Strategy**: Incremental (insert-only, idempotent)

      **Relationships**:
      - Parent for SAT_ORDER (order descriptive attributes)
      - Linked to HUB_CUSTOMER via LINK_ORDER_CUSTOMER
      - Linked to HUB_LINEITEM via LINK_LINEITEM_ORDER
    meta:
      owner: "Data Engineering Team"
      layer: "rdv"
      entity_type: "hub"

    columns:
      - name: order_hk
        description: |
          **Hash Key (Primary Key)**

          MD5 hash of the order business key (ORDER_KEY).
          Enables consistent, performant joins across the vault.

          Format: BINARY(16) - 128-bit MD5 hash
          Hashed from: ORDER_KEY (derived from O_ORDERKEY)
        data_type: binary
        tests:
          - unique:
              config:
                severity: error
          - not_null:
              config:
                severity: error

      - name: order_key
        description: |
          **Natural Business Key**

          Business-friendly order identifier derived from source O_ORDERKEY.
          The human-readable order number used by business operations.

          Derived in staging from: O_ORDERKEY (TPC-H source column)
        data_type: number
        tests:
          - unique:
              config:
                severity: error
          - not_null:
              config:
                severity: error
          - relationships:
              to: source('TPC_H', 'ORDERS')
              field: o_orderkey
              config:
                severity: warn

      - name: load_date
        description: |
          **Load Timestamp**

          When this order business key first appeared in the data warehouse.
          Not the order date - that's in SAT_ORDER payload.
        data_type: timestamp_ntz
        tests:
          - not_null:
              config:
                severity: error
          - dbt_utils.expression_is_true:
              expression: "<= CURRENT_TIMESTAMP()"
              config:
                severity: error

      - name: record_source
        description: "Source system identifier: TPC_H"
        data_type: varchar
        tests:
          - not_null:
              config:
                severity: error
          - accepted_values:
              values: ["TPC_H"]
              config:
                severity: error

  - name: hub_product
    description: |
      **Raw Data Vault Hub: Product/Part Business Keys**

      Contains unique product/part identifiers extracted from line item transactions.
      In TPC-H, these are parts that can be ordered.

      **Pattern**: Hub (Data Vault 2.0)
      **Grain**: One row per unique product/part
      **Source**: stg_dv_lineitem (TPC-H LINEITEM table - derived from L_PARTKEY)
      **Business Key**: PART_KEY (Part/Product ID)
      **Load Strategy**: Incremental (insert-only, idempotent)

      **Note**: Products are identified through line items - no direct product source table
    meta:
      owner: "Data Engineering Team"
      layer: "rdv"
      entity_type: "hub"

    columns:
      - name: part_hk
        description: |
          **Hash Key (Primary Key)**

          MD5 hash of the product/part business key (PART_KEY).

          Format: BINARY(16) - 128-bit MD5 hash
          Hashed from: PART_KEY (derived from L_PARTKEY)
        data_type: binary
        tests:
          - unique:
              config:
                severity: error
          - not_null:
              config:
                severity: error

      - name: part_key
        description: |
          **Natural Business Key**

          Business-friendly product/part identifier derived from source L_PARTKEY.
          References parts that can be ordered by customers.

          Derived in staging from: L_PARTKEY (TPC-H LINEITEM source column)
        data_type: number
        tests:
          - unique:
              config:
                severity: error
          - not_null:
              config:
                severity: error
          - relationships:
              to: source('TPC_H', 'PART')
              field: p_partkey
              config:
                severity: warn

      - name: load_date
        description: "Timestamp when this product key first appeared in data warehouse"
        data_type: timestamp_ntz
        tests:
          - not_null:
              config:
                severity: error

      - name: record_source
        description: "Source system: !TPC_H"
        data_type: varchar
        tests:
          - not_null:
              config:
                severity: error
          - accepted_values:
              values: ["TPC_H"]
              config:
                severity: error

