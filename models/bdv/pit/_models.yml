version: 2

models:
  - name: pit_customer
    description: |
      **Business Data Vault: Point-In-Time Customer Snapshot**

      Pre-calculated snapshots of customer state at specific points in time.
      Joins HUB_CUSTOMER with SAT_CUSTOMER for each AS_OF_DATE.

      **Pattern**: Point-In-Time (PIT) table (Data Vault 2.0)
      **Purpose**: Performance optimization for temporal queries
      **Grain**: One row per customer per as_of_date
      **Parent Hub**: HUB_CUSTOMER
      **Satellites**: SAT_CUSTOMER
      **Load Strategy**: Incremental (remade with each new AS_OF_DATE)

      **Use Case**:
      Instead of complex temporal joins in queries, use PIT table for fast equi-joins:
      ```sql
      SELECT c.customer_name, c.account_balance
      FROM pit_customer p
      JOIN hub_customer h ON p.customer_hk = h.customer_hk
      JOIN sat_customer c ON p.sat_customer_pk = c.customer_hk
                          AND p.sat_customer_ldts = c.load_date
      WHERE p.as_of_date = '2024-01-15'
      ```

      **Performance Benefit**: Eliminates expensive temporal range joins
    meta:
      owner: "Data Engineering Team"
      layer: "bdv"
      entity_type: "pit"

    columns:
      - name: customer_hk
        description: "Primary key from HUB_CUSTOMER"
        data_type: binary
        tests:
          - not_null:
              config:
                severity: error

      - name: as_of_date
        description: "Snapshot date from AS_OF_DATE seed table"
        data_type: date
        tests:
          - not_null:
              config:
                severity: error

      - name: sat_customer_pk
        description: "Hash key pointer to SAT_CUSTOMER record valid at as_of_date"
        data_type: binary
        tests:
          - not_null:
              config:
                severity: warn

      - name: sat_customer_ldts
        description: "Load date of SAT_CUSTOMER record valid at as_of_date"
        data_type: timestamp_ntz
        tests:
          - not_null:
              config:
                severity: warn

